name: Archivage ponctuel branche sécurité backend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-auth-hardening-once.yml']

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archiver la branche fusionnée si SHA inchangé
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/securite-auth-rate-limit-purge-20261023'
          sha='d8872ede4e0edcd1e85c01144e83e2b3b505e549'
          tag='archive/20261023/securite-auth-rate-limit-purge'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/21" --jq '.merged')"
          [[ "$merged" == true ]] || { echo 'PR non fusionnée ; branche conservée'; exit 0; }
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà absente'; exit 0
          fi
          [[ "$current" == "$sha" ]] || { echo 'SHA modifié ; branche conservée'; exit 0; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "$sha" ]] || { echo 'Conflit de tag ; branche conservée'; exit 0; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche archivée et nettoyée'
