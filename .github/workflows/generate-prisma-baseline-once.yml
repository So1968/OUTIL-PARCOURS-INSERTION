name: Génération ponctuelle migration initiale Prisma (CI fictive)
on:
  push:
    branches: [feat/migrations-prisma-versionnees-20261023]
    paths: ['.github/workflows/generate-prisma-baseline-once.yml']

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Adresse fictive ; la génération diff from-empty ne se connecte pas.
      DATABASE_URL: postgresql://demo:demo@127.0.0.1:5432/artag_ci_demo?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrations-prisma-versionnees-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer Prisma de version verrouillée
        run: npm ci --prefix backend
      - name: Générer le SQL depuis le modèle validé, sans exécuter de migration
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend run db:validate
          mkdir -p backend/prisma/migrations/20261023_initial_schema
          (
            cd backend
            ./node_modules/.bin/prisma migrate diff \
              --from-empty \
              --to-schema-datamodel prisma/schema.prisma \
              --script \
              > prisma/migrations/20261023_initial_schema/migration.sql
          )
          file=backend/prisma/migrations/20261023_initial_schema/migration.sql
          test -s "$file"
          grep -q 'CREATE TYPE' "$file"
          grep -q 'CREATE TABLE' "$file"
          grep -q 'WorkTask' "$file"
          grep -q 'WorkEvent' "$file"
      - name: Commiter uniquement le SQL de référence généré
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ARTAG CI (generation fictive)'
          git config user.email 'ci@example.org'
          git add -- backend/prisma/migrations/20261023_initial_schema/migration.sql
          if git diff --cached --quiet; then
            echo 'Migration déjà présente'
            exit 0
          fi
          git commit -m 'Ajoute la migration initiale Prisma générée depuis le schéma'
          git push origin HEAD:refs/heads/feat/migrations-prisma-versionnees-20261023
