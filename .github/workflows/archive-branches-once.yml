name: Archivage ponctuel des branches obsolètes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-branches-once.yml'

permissions:
  contents: write

jobs:
  archival:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Archiver les références exactes, puis retirer les branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive_and_delete() {
            local branch="$1" expected="$2" tag="$3" current existing
            if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              echo "Déjà absent : $branch"
              return 0
            fi
            if [[ "$current" != "$expected" ]]; then
              echo "::warning::Branche modifiée, conservation : $branch"
              return 0
            fi
            if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$existing" != "$expected" ]]; then
                echo "::warning::Tag différent, conservation : $branch"
                return 0
              fi
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$expected" > /dev/null
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null
            echo "Branche archivée puis supprimée : $branch"
          }
          archive_and_delete 'feature/hub-documentaire' 'af148f808d39784312c7639126572cabce5837bb' 'archive/20261022/hub-documentaire'
          archive_and_delete 'feature/hub-documentaire-anonyme' 'af148f808d39784312c7639126572cabce5837bb' 'archive/20261022/hub-documentaire'
          archive_and_delete 'feature/hub-inventaire-documents' '66765fea2a0f30fdbdb86543a3a08c34ca1f41d4' 'archive/20261022/hub-inventaire-documents'
          archive_and_delete 'feature/hub-tri-documentaire' '6cc3f022a6472aef108160900d8858a3721b673d' 'archive/20261022/hub-tri-documentaire'
          archive_and_delete 'chore/assainissement-git-20261022' '9672cf2d54a87be0332043fa3f53a048dd2667b5' 'archive/20261022/assainissement-git'
          # La branche de cette PR n’est nettoyée qu’une fois sa fusion confirmée.
          own_ref='chore/finalisation-git-20261022'
          own_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" --jq '.[] | select(.head.ref == "chore/finalisation-git-20261022" and .base.ref == "main" and .merged_at != null) | .head.sha' | head -n 1)"
          if [[ -n "$own_sha" ]]; then
            archive_and_delete "$own_ref" "$own_sha" 'archive/20261022/finalisation-git'
          else
            echo '::warning::PR de finalisation non encore confirmée : branche conservée.'
          fi
