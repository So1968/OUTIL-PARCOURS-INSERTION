name: Archivage ponctuel de la migration Prisma
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-prisma-migration-once.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conserver le commit exact puis supprimer la branche fusionnée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/migrations-prisma-versionnees-20261023'
          sha='b9df2f9fffc832e7a6b7659d589f813647af74f3'
          tag='archive/20261023/migration-prisma-versionnee'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/26" --jq .merged)"
          [[ "$merged" == true ]] || { echo 'PR non fusionnée : branche conservée'; exit 0; }
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà supprimée'
            exit 0
          fi
          [[ "$current" == "$sha" ]] || { echo 'SHA changé : branche conservée'; exit 0; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "$sha" ]] || { echo 'Tag différent : branche conservée'; exit 0; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche archivée et supprimée'
