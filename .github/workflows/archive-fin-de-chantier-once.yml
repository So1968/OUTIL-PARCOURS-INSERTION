name: Archivage ponctuel — branches sécurité fusionnées
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-fin-de-chantier-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sauvegarder les pointes vérifiées et retirer les branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive() {
            local pr="$1" branch="$2" expected="$3" tag="$4" actual found
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')" != 'true' ]]; then
              echo "::warning::PR non fusionnée : $branch"
              return
            fi
            if ! actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              echo "Branche déjà absente : $branch"
              return
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::warning::Branche modifiée conservée : $branch"
              return
            fi
            if found="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$found" != "$expected" ]]; then
                echo "::warning::Tag différent, branche conservée : $branch"
                return
              fi
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" > /dev/null
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null
            echo "Archivée : $branch"
          }
          archive 11 'feat/session-http-controlee-20261022' '96de140961c44d4c9455663d3fb09c1d1dea4cdf' 'archive/20261022/session-http-controlee'
          archive 12 'feat/oidc-connexion-nominative-20261022' '16620e139db24205e91b5f21cbdde0cb177b9786' 'archive/20261022/oidc-connexion-nominative'
          archive 13 'feat/ecriture-notes-transactionnelles-20261022' '378fac7bacb19f13b4f3d96694fd77cb7aa99272' 'archive/20261022/ecriture-notes-transactionnelles'
          archive 14 'feat/notes-http-csrf-20261022' '6fc531c16e9fd684d649b5191d1448124859caf8' 'archive/20261022/notes-http-csrf'
          archive 15 'fix/direction-derogation-stricte-20261022' 'aa3e52c360c3d6e981658a5c0988b1363969f73f' 'archive/20261022/direction-derogation-stricte'
