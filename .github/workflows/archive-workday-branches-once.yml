name: Archivage ponctuel des branches de tâches consolidées
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-workday-branches-once.yml']

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Vérifier les SHA puis taguer et retirer les anciennes branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive() {
            local branch="$1" expected="$2" tag="$3" pr="$4"
            if [[ "$pr" != "-" ]]; then
              local merged
              merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merged)"
              if [[ "$merged" != true ]]; then
                echo "::warning::PR $pr non fusionnée : conservation de $branch"
                return
              fi
            fi
            local current
            if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null)"; then
              echo "Branche déjà absente : $branch"
              return
            fi
            if [[ "$current" != "$expected" ]]; then
              echo "::warning::Branche modifiée : conservation de $branch"
              return
            fi
            local present
            if present="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              if [[ "$present" != "$expected" ]]; then
                echo "::warning::Tag déjà présent sur autre SHA, branche conservée"
                return
              fi
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" >/dev/null
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Archive confirmée : $branch -> $tag"
          }
          archive 'feat/connecteurs-contrats-inactifs-20261022' '9aaac290e960d5acf155bb2394c93b251ead7642' 'archive/20261023/connecteurs-inactifs' 16
          archive 'feat/plan-charge-saisie-express-20261022' '59c6f84f6b4ccb7896c03ed34c014ef68460e7f9' 'archive/20261023/plan-charge-express' 17
          archive 'fix/taches-automatiques-rappels-quotidiens-20261023' 'f70888aa442c7849886b5973c76c84c84f6ec632' 'archive/20261023/taches-rappels-quotidiens' 18
          # Ancienne expérimentation supplantée par la conception fusionnée.
          # Elle est conservée par tag bien qu'elle n'ait pas été fusionnée.
          archive 'feat/taches-post-entretien-rappels-20261022' '53c988394be4163d0d0e598e1ad2595561be3861' 'archive/20261023/ancienne-experimentation-taches' -
