name: Archivage ponctuel de l'audit Grok
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-grok-audit-once.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conserver le commit avant suppression de la branche fusionnée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/audit-grok-focus-revocation-modes-20261023'
          sha='6140baa2e9bfdd98dde04675119a2d58fc6db7bf'
          tag='archive/20261023/grok-focus-revocation'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/22" --jq .merged)"
          [[ "$merged" == true ]] || { echo 'PR non fusionnée'; exit 0; }
          if ! actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà absente'
            exit 0
          fi
          [[ "$actual" == "$sha" ]] || { echo 'Branche modifiée, non supprimée'; exit 0; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "$sha" ]] || { echo 'Tag en conflit, non supprimée'; exit 0; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche archivée'
