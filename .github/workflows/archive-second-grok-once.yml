name: Archivage ponctuel du second audit Grok
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-second-grok-once.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archiver sans perdre l'historique puis nettoyer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/reprise-tache-et-actions-maintenant-20261023'
          sha='2df9ab797090c5b9104ac8357ea4e4861f1ee729'
          tag='archive/20261023/second-audit-grok-reprise'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/23" --jq .merged)"
          [[ "$merged" == true ]] || { echo 'PR non fusionnée'; exit 0; }
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà absente'; exit 0
          fi
          [[ "$current" == "$sha" ]] || { echo 'SHA modifié, branche conservée'; exit 0; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "$sha" ]] || { echo 'Tag différent, branche conservée'; exit 0; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null
          echo 'Branche fusionnée archivée puis supprimée'
