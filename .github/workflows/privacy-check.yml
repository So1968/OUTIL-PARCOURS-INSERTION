name: Privacy check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  no-sensitive-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-privacy.mjs
