name: Privacy check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  no-sensitive-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-privacy.mjs
