name: Archivage ponctuel branche tâches protégées
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-secure-tasks-once.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archiver le commit vérifié avant suppression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/taches-privees-postgresql-20261023'
          sha='e381848b7d32f0a3a8a7857cda85caa40470fb0b'
          tag='archive/20261023/taches-privees-postgresql'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/19" --jq .merged)"
          [[ "$merged" == true ]] || { echo 'PR non fusionnée, rien à faire'; exit 0; }
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null)"; then
            echo 'Branche déjà supprimée'
            exit 0
          fi
          [[ "$current" == "$sha" ]] || { echo 'SHA changé, branche conservée'; exit 0; }
          if present="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            [[ "$present" == "$sha" ]] || { echo 'Tag en conflit, branche conservée'; exit 0; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche archivée et nettoyée'
