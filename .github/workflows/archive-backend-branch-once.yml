name: Archivage ponctuel de la branche backend fusionnée

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-backend-branch-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le commit, archiver et nettoyer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/backend-fondations-20261022'
          sha='4d1baa3edd9410abeee66c3b70464d680ce5d5f5'
          tag='archive/20261022/backend-fondations'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq '.merged')"
          if [[ "$merged" != 'true' ]]; then
            echo '::warning::PR non fusionnée. Arrêt sûr.'
            exit 0
          fi
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà absente'
            exit 0
          fi
          if [[ "$current" != "$sha" ]]; then
            echo '::warning::La branche a changé; conservation.'
            exit 0
          fi
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing" != "$sha" ]]; then
              echo '::warning::Conflit de tag; conservation.'
              exit 0
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche backend archivée et supprimée.'
