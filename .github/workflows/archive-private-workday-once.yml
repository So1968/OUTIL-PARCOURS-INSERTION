name: Archivage ponctuel du bureau privé
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-private-workday-once.yml']

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.repository == 'So1968/OUTIL-PARCOURS-INSERTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archiver le commit vérifié avant suppression de la branche
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/bureau-prive-evenements-charge-20261023'
          sha='92000b0c93801782bed41dfb6dd4474c79fff4d1'
          tag='archive/20261023/bureau-prive-evenements-charge'
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/24" --jq '.merged')"
          if [[ "$merged" != 'true' ]]; then echo 'PR non fusionnée, branche conservée'; exit 0; fi
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Branche déjà supprimée'
            exit 0
          fi
          if [[ "$current" != "$sha" ]]; then echo 'SHA modifié, branche conservée'; exit 0; fi
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing" != "$sha" ]]; then echo 'Tag différent, branche conservée'; exit 0; fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo 'Branche archivée et retirée'
